name: Portfolio build
on:
  push:
    branches: [phase-1-hero]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit
          else
            npm install --no-audit --no-fund
          fi
      - name: Production build
        run: npm run build
      - name: Commit npm-generated lockfile when missing
        if: success()
        run: |
          if [ ! -f package-lock.json ]; then
            echo "npm did not generate package-lock.json"
            exit 1
          fi
          if git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            echo "package-lock.json is already tracked"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: add npm-generated package lockfile"
          git push origin HEAD:phase-1-hero
